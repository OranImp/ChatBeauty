appId: com.chatbeauty.app
productName: ChatBeauty
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*.cjs
  - build/icon.png
  - build/icon.ico
  - LICENSE
  - package.json
asar: true
win:
  icon: build/icon.ico
  signExecutable: false
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: ChatBeauty
  menuCategory: ChatBeauty
  license: LICENSE
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  include: build/installer.nsh
  language: "2052"
  installerLanguages:
    - zh_CN
    - en_US
  artifactName: ChatBeauty-Setup-${version}.${ext}
portable:
  artifactName: ChatBeauty-Portable-${version}.${ext}
