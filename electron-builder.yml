appId: com.chatbeauty.app
productName: ChatBeauty
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*.cjs
  - build/icon.png
  - build/icon.ico
  - package.json
asar: true
win:
  icon: build/icon.ico
  signExecutable: false
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ChatBeauty-Setup-${version}.${ext}
portable:
  artifactName: ChatBeauty-Portable-${version}.${ext}
